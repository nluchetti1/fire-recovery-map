name: Nighttime Recovery Map

on:
  schedule:
    # Runs at 03:30, 09:30, 15:30, and 21:30 UTC
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch: # Allows manual run button

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeccodes-dev libgdal-dev libgeos-dev libproj-dev

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Wait for Model Data (REFS NOMADS Check)
      id: model_check
      run: |
        HOUR=$(date -u +%H)
        # Determine if we are waiting for the 00, 06, 12, or 18Z run based on the current hour
        if [ "$HOUR" -ge 21 ] || [ "$HOUR" -lt 3 ]; then 
          RUN_HOUR="18"
          DATE=$(date -u -d "6 hours ago" +%Y%m%d) 
        elif [ "$HOUR" -ge 15 ]; then RUN_HOUR="12"; DATE=$(date -u +%Y%m%d)
        elif [ "$HOUR" -ge 9 ];  then RUN_HOUR="06"; DATE=$(date -u +%Y%m%d)
        else RUN_HOUR="00"; DATE=$(date -u +%Y%m%d); fi
        
        URL="https://nomads.ncep.noaa.gov/pub/data/nccf/com/refs/para/refs.${DATE}/${RUN_HOUR}/ensprod/refs.t${RUN_HOUR}z.mean.f01.conus.grib2"
        
        echo "Checking NOMADS for REFS: $URL"
        for i in {1..12}; do
          if curl --output /dev/null --silent --head --fail "$URL"; then
            echo "Data is Ready!"
            exit 0
          fi
          echo "Attempt $i/12: Data not found yet. Waiting 5 mins..."
          sleep 300
        done
        echo "Data timed out. Exiting."
        exit 1

    - name: Run Map Script
      run: python scripts/main.py

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
